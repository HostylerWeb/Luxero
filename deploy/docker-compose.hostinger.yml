# Luxero apps + MinIO + Caddy on Hostinger (joins existing luxero_net / mongo / redis).
# Infra: /var/www/luxero/docker-compose.infra.yml
# Env:   /root/luxero-app.env (generated by deploy/scripts/hostinger-env.sh)

name: luxero-apps

services:
  minio:
    image: minio/minio:latest
    container_name: luxero_minio
    restart: unless-stopped
    command: server /data/minio --console-address ":9001"
    env_file:
      - /root/luxero-app.env
    environment:
      MINIO_SERVER_URL: https://assets.srv2011364.hstgr.cloud
    volumes:
      - /var/www/luxero/data/minio:/data
    networks:
      - luxero_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: luxero_minio_init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    env_file:
      - /root/luxero-app.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
        mc mb local/luxero-assets --ignore-existing
        mc anonymous set download local/luxero-assets
    networks:
      - luxero_net

  client:
    build:
      context: ../turborepo-main
      dockerfile: apps/client/Dockerfile
    container_name: luxero_client
    restart: unless-stopped
    env_file:
      - /root/luxero-app.env
      - /root/luxero-client.env
      - /root/luxero-secrets.env
    environment:
      PORT: "3000"
      NODE_ENV: production
    networks:
      - luxero_net

  admin:
    build:
      context: ../turborepo-main
      dockerfile: apps/admin/Dockerfile
    container_name: luxero_admin
    restart: unless-stopped
    env_file:
      - /root/luxero-app.env
      - /root/luxero-admin.env
      - /root/luxero-secrets.env
    environment:
      PORT: "3000"
      NODE_ENV: production
      FRAMEWORK: next
    networks:
      - luxero_net

  shop:
    build:
      context: ../turborepo-main
      dockerfile: apps/shop/Dockerfile
    container_name: luxero_shop
    restart: unless-stopped
    env_file:
      - /root/luxero-app.env
      - /root/luxero-shop.env
      - /root/luxero-secrets.env
    environment:
      PORT: "3000"
      NODE_ENV: production
    networks:
      - luxero_net

  caddy:
    image: caddy:2-alpine
    container_name: luxero_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/www/luxero/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/www/luxero/data/caddy:/data
      - /var/www/luxero/data/caddy-config:/config
    depends_on:
      - client
      - admin
      - shop
      - minio
    networks:
      - luxero_net

networks:
  luxero_net:
    external: true
